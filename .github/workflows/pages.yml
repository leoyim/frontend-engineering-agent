name: Deploy to GitHub Pages

# 部署的是 public/ 这一个目录：它就是完整的静态站点，
# 页面加载后探测不到 /api，会自动切到浏览器内的 client-backend.js。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推上去就取消排队中的旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 语料改过却忘了重新生成 knowledge.json 的话，站点会用旧资料作答，
      # 而且页面上不会有任何异常 —— 这条检查就是为了拦住这种静默过期。
      - name: 生成物必须是最新的
        run: |
          # 三份产物各有各的静默失败方式：
          #   knowledge.json 过期 -> 用旧资料作答，页面毫无异常；
          #   nodes.json 缺失/过期 -> 静态形态下「按需组课」直接报错；
          #   core.js 的 COURSE 过期 -> 侧栏课表少章，进度分母不对。
          node tools/build-knowledge.js
          node tools/build-nodes.js
          node tools/build-course.js
          if ! git diff --exit-code -- public/frontend-engineering-agent/knowledge.json \
                                       public/frontend-engineering-agent/nodes.json \
                                       public/frontend-engineering-agent/core.js; then
            echo "::error::knowledge/ 改过内容，但生成物没重新生成。请本地运行 npm run check:knowledge 并提交产物。"
            exit 1
          fi

      - name: 静态站点自检
        run: |
          APP=public/frontend-engineering-agent
          test -f public/index.html          # 站点根：跳转页
          test -f "$APP/index.html"          # 应用本体
          test -f "$APP/core.js"
          test -f "$APP/client-backend.js"
          test -f "$APP/knowledge.json"
          test -f "$APP/nodes.json"          # 静态形态组课依赖它
          echo "站点根：  $(ls public | tr '\n' ' ')"
          echo "应用目录：$(ls $APP | tr '\n' ' ')"

      # CNAME 丢了不会报错，只会让站点悄悄退回 leoyim.github.io/<repo> 的地址，
      # 而且自定义域名的 HTTPS 证书也会跟着失效。所以在这里挡一道。
      - name: 自定义域名声明必须在
        run: |
          test -f public/CNAME || { echo "::error::public/CNAME 缺失，站点会退回默认地址"; exit 1; }
          echo "CNAME: $(cat public/CNAME)"

      # 站点根的跳转目标必须与应用的目录名一致。改了目录名却忘了改跳转页
      # （或反过来），得到的是「能打开但进不去应用」的站点，而且不会有任何报错。
      - name: 站点根跳转必须指向应用目录
        run: |
          grep -q 'url=\./frontend-engineering-agent/' public/index.html \
            || { echo "::error::public/index.html 的跳转目标不是 ./frontend-engineering-agent/"; exit 1; }
          echo "跳转目标正确"

      # 相对路径是子路径部署的前提。绝对路径（以 / 开头）在本部署形态下
      # 会指向域名根而不是应用目录，页面能开、但样式和脚本会 404。
      - name: 应用静态资源必须用相对路径
        run: |
          APP=public/frontend-engineering-agent
          if grep -nE '(src|href)="/' "$APP/index.html"; then
            echo "::error::$APP/index.html 里出现以 / 开头的绝对路径，子路径下会 404"
            exit 1
          fi
          echo "资源引用均为相对路径"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
